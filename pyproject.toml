[project]
name = "etl-parser"
version = "0.1.0"
description = "Deterministic table- and column-level lineage from ETL repositories (SQL, Python/Pandas, PySpark, Airflow), with code-grounded description prompts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "sqlglot>=30",
    "networkx>=3.2",
    "pyyaml>=6",
    "typer>=0.12",
    "openlineage-python>=1.30",
]

# Schema sources are optional: the drivers are imported lazily, inside the source that
# needs them, so a deterministic scan never requires a database client. Every dependency
# here must resolve on your internal package index before it is added.
[project.optional-dependencies]
glue = ["boto3>=1.34"]
postgres = ["psycopg[binary]>=3.1"]
redshift = ["redshift_connector>=2.1"]

[project.scripts]
etl-parser = "etl_parser.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl_parser"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
