[project]
name = "etl-parser"
version = "0.1.0"
description = "Deterministic table- and column-level lineage from ETL repositories (SQL, Python/Pandas, PySpark, Airflow), with code-grounded description prompts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "sqlglot>=30",
    "networkx>=3.2",
    "pyyaml>=6",
    "typer>=0.12",
    "openlineage-python>=1.30",
    "astroid>=3.3",
]

[project.optional-dependencies]
glue = ["boto3>=1.34"]

[project.scripts]
etl-parser = "etl_parser.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl_parser"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
