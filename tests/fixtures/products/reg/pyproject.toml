[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "de-reg-data-product"
version = "0.1.0"
description = "regulatory_reporting (reg) — PySpark + SQL data product: SAIDI/SAIFI, energy-sold and collections regulatory marts over the Athena medallion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Regulatory Reporting Team", email = "regulatory-reporting@utility.example.com" }]
keywords = ["data-product", "pyspark", "sql", "athena", "regulatory-reporting", "utility"]

dependencies = [
    "pyspark>=3.5",
    "apache-airflow>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
delta = ["delta-spark>=3.1"]
load = ["awswrangler>=3.5", "boto3>=1.34", "pandas>=2.1"]

[tool.uv]
package = false
dev-dependencies = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["glue"]
