[project]
name = "de-bill-data-product"
version = "0.1.0"
description = "billing (bill) — standalone utility-sector data product: pandas+JDBC ETL, Airflow orchestration, medallion Athena layers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "billing-team", email = "billing-team@utility.example.com" }]
dependencies = [
    "pandas>=2",
    "sqlalchemy>=2",
    "psycopg2-binary>=2.9",
    "apache-airflow>=2.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Loading parquet to Athena (load_to_athena.py) needs AWS SDKs.
aws = [
    "awswrangler>=3",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobs"]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8",
    "ruff>=0.5",
]
